<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 62" fill="none">
  <!-- Sprout leaves growing from the first 'I' -->
  <g transform="translate(68, 1)">
    <!-- Left Leaf -->
    <path d="M11 20 C6 13 1 8 0 1 C9 0 16 6 16 17 C16 19 14 20 11 20 Z" fill="#22c55e"/>
    <!-- Right Leaf -->
    <path d="M16 20 C18 12 27 6 35 0 C33 10 26 17 17 19 C16 19 16 20 16 20 Z" fill="#15803d"/>
    <!-- Veins -->
    <path d="M15 19 Q17 12 24 6" stroke="#166534" stroke-width="1" stroke-linecap="round" fill="none"/>
    <path d="M12 19 Q9 12 3 6" stroke="#16a34a" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Brand Name: VA in forest green, IVIKA in deep ocean navy -->
  <text x="0" y="44" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="0.01em">
    <tspan fill="#15803d">VA</tspan><tspan fill="#0c4a6e">IVIKA</tspan>
  </text>
  <text x="228" y="24" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0c4a6e">™</text>

  <!-- Clean Sub-tagline -->
  <text x="2" y="58" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" letter-spacing="0.14em">NATURAL GOODNESS FOR A HEALTHIER TOMORROW</text>
</svg>
